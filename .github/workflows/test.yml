name: test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Report formatting drift
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files requiring gofmt:"
            echo "$files"
          else
            echo "All Go files are gofmt-clean."
          fi

      - name: Test
        run: go test -count=1 ./...
