name: test

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      - name: Darwin arm64 compile check
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...
