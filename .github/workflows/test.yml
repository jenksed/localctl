name: test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format lab sources
        run: gofmt -w exercise_test.go lab_cli.go runtime.go

      - name: Commit formatting on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/baseline-exercise-lab'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exercise_test.go lab_cli.go runtime.go
            git commit -m "gofmt lab sources"
            git push
          fi

      - name: Test
        run: go test -count=1 ./...
