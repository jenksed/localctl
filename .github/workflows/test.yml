name: test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format diagnostic
        run: |
          gofmt -w .
          git diff --stat
          git diff

      - name: Test
        run: go test -count=1 ./...
